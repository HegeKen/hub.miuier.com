name: Android Build

# 手动触发：在 Actions 页面选择 "Run workflow" 并（可选）填写版本号
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName（留空则为 0.1.<versionCode>）'
        required: false
        default: ''
        type: string
      version_code:
        description: 'versionCode（留空则用 version.properties 里的值）'
        required: false
        default: ''
        type: string

# 创建 / 更新 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    # gradlew 与 settings.gradle.kts 都位于 app/android
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.x 要求 JDK 17+，本工程按 JDK 21 构建
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk = 37 为 MIUIX 0.9.4 的 AAR metadata 硬性要求
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本号的正主是 app/android/version.properties（versionName 自动拼成 0.1.<versionCode>）。
      # 这里只在手动填了输入时才用 -P 覆盖，两个都留空就完全按仓库里的版本走。
      - name: Resolve version overrides
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ARGS=""
          if [ -n "$INPUT_VERSION_CODE" ]; then
            ARGS="$ARGS -PversionCode=$INPUT_VERSION_CODE"
          fi
          if [ -n "$INPUT_VERSION_NAME" ]; then
            ARGS="$ARGS -PversionName=$INPUT_VERSION_NAME"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "仓库里的版本：" && grep -E '^versionCode' version.properties

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace ${{ steps.version.outputs.args }}

      # 统一产物名并读取实际生效的版本号（由 :composeApp:writeResolvedVersion 随构建落盘）
      - name: Collect artifact
        id: artifact
        run: |
          VERSION=$(head -n 1 composeApp/build/resolved-version.txt)
          mkdir -p dist
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "dist/miroms-hub-android-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miroms-hub-android-${{ steps.artifact.outputs.version }}
          path: app/android/dist/*.apk
          if-no-files-found: error

      # 同一 tag 重复运行时为更新该 Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.artifact.outputs.version }}
          name: Android v${{ steps.artifact.outputs.version }}
          files: app/android/dist/*.apk
          generate_release_notes: true
