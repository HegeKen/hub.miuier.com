# MiROMS HUB Android 版本号
#
# versionCode 是这里唯一需要维护的数：Android 靠它判断能否覆盖安装，必须单调递增。
# 发版前在 app/android 下执行 ./gradlew :composeApp:bumpVersion 自增，
# 然后连同本次代码改动一起提交本文件。
#
# versionName 不写在这里：构建时按 0.1.<versionCode> 拼出来（见 composeApp/build.gradle.kts）。
# 所以自增 versionCode 就等于 versionName 一起自增。
# CI 上手动填了 version_code / version_name 时可用 -P 覆盖，见 .github/workflows/android-build.yml。
versionCode=1
