org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 是硬性要求（Compose 全家桶都在 androidx 命名空间下）
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 起，com.android.application 默认不再允许和 kotlin-multiplatform 插件共存
# （报错原文：“The 'com.android.library' (or 'com.android.application') plugin is not
#  compatible with the 'org.jetbrains.kotlin.multiplatform' plugin since AGP 9.0”）。
# AGP 自己在报错里给出了这两个兼容开关。这样能继续沿用官方 CMP 模板的单模块结构
# （composeApp 同时是 Android 应用和 KMP 模块）。
# 注意：AGP 把它标注为「临时绕过」，将来要迁移到
# com.android.kotlin.multiplatform.library（KMP 库）+ com.android.application（应用）双模块结构。
android.builtInKotlin=false
android.newDsl=false
